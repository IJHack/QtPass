version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "IJHack"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "**/*.html"
precedence = "aggregate"
SPDX-FileCopyrightText = "IJHack"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "images/*"
precedence = "aggregate"
SPDX-FileCopyrightText = "AnonMoos"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "fonts/*"
precedence = "aggregate"
SPDX-FileCopyrightText = "Łukasz Dziedzic"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "images/openbsd.png"
precedence = "override"
SPDX-FileCopyrightText = "art.gnux.info (OpenBSD Puffy, https://commons.wikimedia.org/wiki/File:Puffy.png)"
SPDX-License-Identifier = "CC-BY-1.0"

# Screenshots and captures are renderings of QtPass's own UI.
[[annotations]]
path = ["images/qtpass*", "images/config*", "images/windows-app*", "images/macos-app*", "images/freebsd-app*", "images/gnome-app*", "images/2.0/**", "video/**"]
precedence = "override"
SPDX-FileCopyrightText = "IJHack"
SPDX-License-Identifier = "CC0-1.0"

# Platform logos: Tux under Larry Ewing's own terms, the rest are the
# platforms' trademarks, used to name the platform (see the LicenseRef texts).
[[annotations]]
path = "images/linux.png"
precedence = "override"
SPDX-FileCopyrightText = "Larry Ewing <lewing@isc.tamu.edu> (Tux, drawn with The GIMP)"
SPDX-License-Identifier = "LicenseRef-Tux"

[[annotations]]
path = "images/freebsd.png"
precedence = "override"
SPDX-FileCopyrightText = "The FreeBSD Foundation"
SPDX-License-Identifier = "LicenseRef-Trademark"

[[annotations]]
path = ["images/windows.png", "images/win11.png"]
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation"
SPDX-License-Identifier = "LicenseRef-Trademark"

[[annotations]]
path = "images/macos.png"
precedence = "override"
SPDX-FileCopyrightText = "IJHack (badge; macOS is a trademark of Apple Inc.)"
SPDX-License-Identifier = "LicenseRef-Trademark"
