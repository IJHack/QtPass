---
name: Release installers

on:
  pull_request:
    branches:
      - main
      - "1.8"
  push:
    tags:
      - "v*"
  merge_group:
  # A manual run builds the installers for the chosen ref. Run on main it
  # also signs the Windows one, which is how a signing setup change is tried
  # out before a release; on any other branch the build is unsigned. (No
  # inputs: Checkov CKV_GHA_7 wants the build defined by the ref alone.)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      tests: ${{ steps.filter.outputs.tests }}
      qt: ${{ steps.filter.outputs.qt }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: main
          filters: |
            src:
              - "src/**"
              - "**.cpp"
              - "**.h"
              - "**.hpp"
              - "**.ui"
              - "**.qrc"
            tests:
              - "tests/**"
            qt:
              - "**.pro"
              - "**.pri"
            # The AppImage bundles these but no compiled source changes with
            # them, so the src/qt filters above would miss an edit to them.
            packaging:
              - "scripts/build-appimage.sh"
              - "qtpass.desktop"
              - "org.qtpass.QtPass.metainfo.xml"
              - "qtpass.1"
              - "artwork/**"
              - ".github/workflows/release-installers.yml"

  build-windows:
    name: Windows installer
    needs: changes
    runs-on: windows-latest
    # The SignPath token is a secret of the signpath environment, whose
    # deployment rules admit v* tags and main only. Pull requests and manual
    # runs on other branches do not enter the environment at all, so they
    # build an unsigned installer instead of being blocked.
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && 'signpath' || '' }}
    steps:
      - name: Check if build needed
        id: need_build
        shell: bash
        run: |
          if [[ "${NEEDS_CHANGES_OUTPUTS_SRC}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_TESTS}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_QT}" == "true" ]] || \
             [[ "${{ github.event_name }}" == "merge_group" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NEEDS_CHANGES_OUTPUTS_SRC: ${{ needs.changes.outputs.src }}
          NEEDS_CHANGES_OUTPUTS_TESTS: ${{ needs.changes.outputs.tests }}
          NEEDS_CHANGES_OUTPUTS_QT: ${{ needs.changes.outputs.qt }}

      - name: No changes - skipping
        if: steps.need_build.outputs.run_build != 'true'
        run: echo "No relevant changes - skipping Windows build"

      # Code signing through the SignPath Foundation: tag pushes and manual
      # runs on main only, and only once the SIGNPATH_API_TOKEN secret exists (in the
      # signpath environment). Pull requests never sign. The organization id is the repository variable
      # SIGNPATH_ORGANIZATION_ID; SIGNPATH_SIGNING_POLICY_SLUG can override
      # the policy, release-signing (SignPath's test certificate until the
      # production one is imported; every request waits for an approver).
      - name: Decide on code signing
        if: steps.need_build.outputs.run_build == 'true'
        id: signing
        shell: bash
        run: |
          if [[ "${HAS_TOKEN}" == "true" && -n "${ORGANIZATION_ID}" ]] && \
             [[ "${GITHUB_REF}" =~ ^refs/tags/v || "${GITHUB_EVENT_NAME}:${GITHUB_REF}" == "workflow_dispatch:refs/heads/main" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing with SignPath policy '${POLICY}'"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Not signing (pull request, or SignPath not configured)"
          fi
        env:
          HAS_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.need_build.outputs.run_build == 'true'
        with:
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: steps.need_build.outputs.run_build == 'true'

      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        if: steps.need_build.outputs.run_build == 'true'
        with:
          # The Windows installer ships on Qt 6.8 (LTS).
          version: "6.8"
          cache: true

      - name: Install Inno Setup
        if: steps.need_build.outputs.run_build == 'true'
        run: choco install --yes innosetup

      - name: Resolve installer version
        if: steps.need_build.outputs.run_build == 'true'
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $line = Get-Content qtpass.pri | Where-Object { $_ -match '^VERSION\s*=' } | Select-Object -First 1
            if ($line -and ($line -match '=\s*([0-9]+\.[0-9]+\.[0-9]+)')) {
              $version = $matches[1]
            } else {
              throw "No VERSION found in qtpass.pri"
            }
          }

          # Windows version resources take four numbers only, so a
          # pre-release tag like 2.0.0-rc2 is 2.0.0 there.
          if ($version -notmatch '^([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Version '$version' does not start with major.minor.patch"
          }
          $numeric = $matches[1]

          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "numeric=$numeric" >> $env:GITHUB_OUTPUT

      - name: Build and stage qtpass.exe
        if: steps.need_build.outputs.run_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          qmake qtpass.pro CONFIG+=release
          nmake

          New-Item -ItemType Directory -Force -Path dist\qtpass | Out-Null

          if (Test-Path "main\release\qtpass.exe") {
            Copy-Item "main\release\qtpass.exe" "dist\qtpass\qtpass.exe"
          } elseif (Test-Path "src\release\qtpass.exe") {
            Copy-Item "src\release\qtpass.exe" "dist\qtpass\qtpass.exe"
          } else {
            throw "Could not locate built qtpass.exe"
          }

          Copy-Item "README.md" "dist\qtpass\README.txt"
          Copy-Item "LICENSE" "dist\qtpass\LICENSE.txt"

          windeployqt --release --dir dist\qtpass dist\qtpass\qtpass.exe

          # SignPath refuses a binary without the product name and version
          # it expects; show what the version resource carries.
          (Get-Item dist\qtpass\qtpass.exe).VersionInfo |
            Format-List ProductName, ProductVersion, FileDescription, FileVersion, CompanyName, LegalCopyright

      # Only qtpass.exe is ours to sign. The Qt libraries windeployqt copies
      # in stay as Qt ships them (SignPath Foundation terms: no upstream
      # binaries under the project certificate).
      # SignPath gets each file bare (archive: false, skip-decompress: true),
      # so its artifact configuration has a <pe-file> root. Such an artifact
      # is named after its file; the publish job's pattern leaves these out.
      - name: Upload unsigned qtpass.exe for signing
        if: steps.signing.outputs.enabled == 'true'
        id: upload-unsigned-exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/qtpass/qtpass.exe
          archive: false
          retention-days: 1

      - name: Sign qtpass.exe
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'QtPass' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          # release-signing waits for an approver in SignPath.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/exe
          skip-decompress: true

      - name: Use the signed qtpass.exe
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sig = Get-AuthenticodeSignature signed\exe\qtpass.exe
          Write-Output "qtpass.exe: $($sig.Status), $($sig.SignerCertificate.Subject)"
          # Valid only. While SignPath signs with its self-signed test
          # certificate (repository variable SIGNPATH_TEST_CERTIFICATE),
          # Windows reports UnknownError for it; that is accepted only when
          # the untrusted root is the chain's one problem. A bad digest is
          # HashMismatch and never accepted.
          function Test-Signature($sig) {
            if (-not $sig.SignerCertificate) { return $false }
            if ($sig.Status -eq "Valid") { return $true }
            if ($env:TEST_CERTIFICATE -ne "true" -or $sig.Status -ne "UnknownError") { return $false }
            $chain = [System.Security.Cryptography.X509Certificates.X509Chain]::new()
            $chain.ChainPolicy.RevocationMode = "NoCheck"
            $null = $chain.Build($sig.SignerCertificate)
            $problems = @($chain.ChainStatus | ForEach-Object { "$($_.Status)" } | Where-Object { $_ -ne "UntrustedRoot" })
            Write-Host "certificate chain: $(($chain.ChainStatus | ForEach-Object { $_.Status }) -join ", ")"
            return ($problems.Count -eq 0)
          }
          if (-not (Test-Signature $sig)) {
            throw "qtpass.exe came back without an acceptable signature"
          }
          Copy-Item signed\exe\qtpass.exe dist\qtpass\qtpass.exe -Force
        env:
          TEST_CERTIFICATE: ${{ vars.SIGNPATH_TEST_CERTIFICATE }}

      - name: Build Windows installer
        if: steps.need_build.outputs.run_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          iscc "/DMyAppVersion=$env:VERSION" "/DMyAppNumericVersion=$env:NUMERIC" qtpass.iss
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NUMERIC: ${{ steps.version.outputs.numeric }}

      - name: Upload unsigned installer for signing
        if: steps.signing.outputs.enabled == 'true'
        id: upload-unsigned-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: Output/qtpass-${{ steps.version.outputs.version }}.exe
          archive: false
          retention-days: 1

      - name: Sign the installer
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'QtPass' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/installer
          skip-decompress: true

      - name: Use the signed installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem signed\installer\qtpass-*.exe | Select-Object -First 1
          if (-not $installer) { throw "SignPath returned no installer" }
          $sig = Get-AuthenticodeSignature $installer.FullName
          Write-Output "$($installer.Name): $($sig.Status), $($sig.SignerCertificate.Subject)"
          # Same rule as for qtpass.exe above.
          function Test-Signature($sig) {
            if (-not $sig.SignerCertificate) { return $false }
            if ($sig.Status -eq "Valid") { return $true }
            if ($env:TEST_CERTIFICATE -ne "true" -or $sig.Status -ne "UnknownError") { return $false }
            $chain = [System.Security.Cryptography.X509Certificates.X509Chain]::new()
            $chain.ChainPolicy.RevocationMode = "NoCheck"
            $null = $chain.Build($sig.SignerCertificate)
            $problems = @($chain.ChainStatus | ForEach-Object { "$($_.Status)" } | Where-Object { $_ -ne "UntrustedRoot" })
            Write-Host "certificate chain: $(($chain.ChainStatus | ForEach-Object { $_.Status }) -join ", ")"
            return ($problems.Count -eq 0)
          }
          if (-not (Test-Signature $sig)) {
            throw "$($installer.Name) came back without an acceptable signature"
          }
          Copy-Item $installer.FullName Output\ -Force
        env:
          TEST_CERTIFICATE: ${{ vars.SIGNPATH_TEST_CERTIFICATE }}

      - name: Upload installer artifact
        if: steps.need_build.outputs.run_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qtpass-windows-installer-${{ steps.version.outputs.version }}
          path: Output/qtpass-*.exe

  build-macos:
    name: macOS dmg
    needs: changes
    runs-on: macos-latest
    steps:
      - name: Check if build needed
        id: need_build
        shell: bash
        run: |
          if [[ "${NEEDS_CHANGES_OUTPUTS_SRC}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_TESTS}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_QT}" == "true" ]] || \
             [[ "${{ github.event_name }}" == "merge_group" ]] || \
             [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NEEDS_CHANGES_OUTPUTS_SRC: ${{ needs.changes.outputs.src }}
          NEEDS_CHANGES_OUTPUTS_TESTS: ${{ needs.changes.outputs.tests }}
          NEEDS_CHANGES_OUTPUTS_QT: ${{ needs.changes.outputs.qt }}

      - name: No changes - skipping
        if: steps.need_build.outputs.run_build != 'true'
        run: echo "No relevant changes - skipping macOS build"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.need_build.outputs.run_build == 'true'
        with:
          persist-credentials: false

      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        if: steps.need_build.outputs.run_build == 'true'
        with:
          # Qt 6.11 (6.11.1+) is required to build on the macos-latest runner:
          # its Xcode 26.x clang rejects the ARM __yield intrinsic used by
          # Qt 6.8.x's qyieldcpu.h. 6.11 reordered that header to prefer
          # __builtin_arm_yield, so it compiles cleanly.
          # See the checksum note in build-and-test.yml if a new patch fails.
          version: "6.11"
          cache: true

      - name: Install dmg helper
        if: steps.need_build.outputs.run_build == 'true'
        run: brew install create-dmg

      - name: Resolve dmg version
        if: steps.need_build.outputs.run_build == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(awk -F '=' '/^VERSION[[:space:]]*=/{ gsub(/[[:space:]]/, "", $2); print $2; exit }' qtpass.pri)"
            if [[ -z "${version}" ]]; then
              echo "No VERSION found in qtpass.pri" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build macOS app and dmg
        if: steps.need_build.outputs.run_build == 'true'
        run: |
          set -euo pipefail

          qmake qtpass.pro CONFIG+=release
          make

          APP_PATH="main/QtPass.app"
          if [ ! -d "$APP_PATH" ]; then
            if [ -d "src/QtPass.app" ]; then
              APP_PATH="src/QtPass.app"
            else
              echo "QtPass.app not found" >&2
              exit 1
            fi
          fi

          macdeployqt "$APP_PATH"

          DMG_NAME="QtPass-${STEPS_VERSION_OUTPUTS_VERSION}.dmg"
          create-dmg "$DMG_NAME" "$APP_PATH"
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload dmg artifact
        if: steps.need_build.outputs.run_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qtpass-macos-dmg-${{ steps.version.outputs.version }}
          path: QtPass-*.dmg

  build-appimage:
    name: Linux AppImage
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Check if build needed
        id: need_build
        shell: bash
        run: |
          if [[ "${NEEDS_CHANGES_OUTPUTS_SRC}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_TESTS}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_QT}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_PACKAGING}" == "true" ]] || \
             [[ "${{ github.event_name }}" == "merge_group" ]] || \
             [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NEEDS_CHANGES_OUTPUTS_SRC: ${{ needs.changes.outputs.src }}
          NEEDS_CHANGES_OUTPUTS_TESTS: ${{ needs.changes.outputs.tests }}
          NEEDS_CHANGES_OUTPUTS_QT: ${{ needs.changes.outputs.qt }}
          NEEDS_CHANGES_OUTPUTS_PACKAGING: ${{ needs.changes.outputs.packaging }}

      - name: No changes - skipping
        if: steps.need_build.outputs.run_build != 'true'
        run: echo "No relevant changes - skipping AppImage build"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.need_build.outputs.run_build == 'true'
        with:
          persist-credentials: false

      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        if: steps.need_build.outputs.run_build == 'true'
        with:
          # The AppImage ships on Qt 6.8 (LTS), like the Windows installer.
          # Qt SVG is part of the base install; it is not an add-on module.
          version: "6.8"
          cache: true

      # linuxdeploy and its Qt plugin are AppImages themselves. The build
      # script runs them with APPIMAGE_EXTRACT_AND_RUN=1 so no FUSE is needed
      # here, but the Qt plugin still shells out to patchelf and friends.
      # appstream provides appstreamcli, which the script uses to validate
      # the metainfo file; xvfb and weston are the X11 and Wayland displays
      # for the smoke tests below.
      - name: Install packaging dependencies
        if: steps.need_build.outputs.run_build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2t64 patchelf desktop-file-utils file appstream \
            xvfb weston

      - name: Resolve AppImage version
        if: steps.need_build.outputs.run_build == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(awk -F '=' '/^VERSION[[:space:]]*=/{ gsub(/[[:space:]]/, "", $2); print $2; exit }' qtpass.pri)"
            if [[ -z "${version}" ]]; then
              echo "No VERSION found in qtpass.pri" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        if: steps.need_build.outputs.run_build == 'true'
        run: ./scripts/build-appimage.sh dist
        env:
          VERSION: ${{ steps.version.outputs.version }}

      # A broken bundle still packages cleanly, so prove it actually runs, on
      # X11 (Xvfb) and on Wayland (headless Weston, exercising the bundled
      # libqwayland-generic.so, its shell-integration plugins and their
      # libraries). QtPass builds its QApplication before looking at argv and
      # has no --version short-circuit, so each run has to be killed:
      # surviving the timeout is the pass condition, and any earlier exit
      # means Qt, a plugin or a bundled library failed to load.
      - name: Smoke-test the AppImage
        if: steps.need_build.outputs.run_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          appimage="dist/QtPass-${STEPS_VERSION_OUTPUTS_VERSION}-x86_64.AppImage"
          test -f "$appimage"
          chmod +x "$appimage"
          # Qt's own packages ship the Wayland client plugins, so the build
          # script must have bundled them.
          test -f build-appimage/AppDir/usr/plugins/platforms/libqwayland-generic.so
          test -d build-appimage/AppDir/usr/plugins/wayland-shell-integration

          # No FUSE on the runner, so run the extracted payload.
          export APPIMAGE_EXTRACT_AND_RUN=1

          # stayed_up LOG: 124 means the timeout fired, 143 killed by SIGTERM;
          # anything else is an exit of its own.
          stayed_up() {
            local rc=$1 log=$2
            if [ "$rc" -ne 124 ] && [ "$rc" -ne 143 ]; then
              echo "AppImage exited on its own (rc=$rc); output follows:" >&2
              cat "$log" >&2
              return 1
            fi
          }

          rc=0
          timeout --signal=TERM 30 xvfb-run -a "$appimage" > smoke-x11.log 2>&1 || rc=$?
          stayed_up "$rc" smoke-x11.log
          echo "AppImage started on X11 and stayed running."

          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wl-qtpass --idle-time=0 \
            > weston.log 2>&1 &
          for _ in $(seq 1 50); do
            [ -S "$XDG_RUNTIME_DIR/wl-qtpass" ] && break
            sleep 0.2
          done
          test -S "$XDG_RUNTIME_DIR/wl-qtpass" || { cat weston.log >&2; exit 1; }

          rc=0
          QT_QPA_PLATFORM=wayland WAYLAND_DISPLAY=wl-qtpass \
            timeout --signal=TERM 30 "$appimage" > smoke-wayland.log 2>&1 || rc=$?
          stayed_up "$rc" smoke-wayland.log
          # QT_QPA_PLATFORM names wayland alone, no fallback: had the plugin
          # failed to load, Qt would have aborted, so surviving means it ran
          # on Wayland.
          echo "AppImage started on Wayland and stayed running."
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload AppImage artifact
        if: steps.need_build.outputs.run_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qtpass-appimage-${{ steps.version.outputs.version }}
          path: dist/QtPass-*.AppImage

  # Tag pushes only: attach what the three build jobs produced, plus the source
  # archives, to the GitHub release for that tag. The release is created as a
  # draft when it does not exist yet, so the maintainer only writes the notes,
  # signs the assets (scripts/sign-release-assets.sh) and publishes. Nothing
  # here is downloaded and re-uploaded by hand any more.
  publish:
    name: Publish assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
      - build-appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestation (#1988): records which workflow run,
      # commit and inputs produced each asset, so a download can be checked
      # with `gh attestation verify` / `slsa-verifier`.
      attestations: write
      id-token: write
    steps:
      # This job holds a write token, so its actions are pinned to commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          # Only the three build artifacts, not the bare unsigned inputs of
          # the signing steps: the unsigned installer artifact is called
          # qtpass-x.y.z.exe and holds a file named like the signed one.
          pattern: qtpass-{windows-installer,macos-dmg,appimage}-*
          merge-multiple: true

      - name: Source archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Same names GitHub gives its automatic archives, so debian/watch
          # and sign-release-assets.sh keep working; unlike the automatic
          # ones these are release assets and never regenerate.
          git archive --prefix="qtpass-${version}/" \
            -o "dist/QtPass-${version}.tar.gz" HEAD
          git archive --prefix="qtpass-${version}/" \
            -o "dist/QtPass-${version}.zip" HEAD
          ls -l dist

      # Hoisted out of the final step below so the next step can query the
      # release's existing assets — gh release view 404s until the release
      # exists. Idempotent and harmless to repeat; the final step's own
      # create-if-needed check is left exactly as it was.
      - name: Create the draft release if needed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "QtPass ${version}" \
              --notes "Draft created by the Release installers workflow. Replace this with the CHANGELOG section for ${version}."
          fi

      # On a draft, the final step below clobber-uploads every file in
      # dist/* — all of it becomes live, so attesting all of dist/* is
      # correct. On an already-published release it uploads only the
      # files that are not already a same-named asset, leaving the live
      # bytes of the rest untouched (see "keeping published asset" below);
      # a re-run that rebuilt those files cannot assume this run's bytes
      # are what stays live, so attesting dist/* unconditionally there
      # would produce provenance for bytes that are not actually published.
      # This step computes exactly the subset that this run will cause to
      # become live, for the provenance step below to cover.
      - name: Determine which release assets are new in this run
        id: assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
          {
            echo "new-files<<ASSET_EOF"
            for file in dist/*; do
              if [[ "$is_draft" == "true" ]] || ! grep -qxF "$(basename "$file")" <<<"$existing"; then
                printf '%s\n' "$file"
              fi
            done
            echo "ASSET_EOF"
          } >> "$GITHUB_OUTPUT"

      # SLSA build provenance (#1988): attests, with a GitHub-issued OIDC
      # identity, that this workflow run and commit produced these exact
      # bytes. One attestation covers every subject (a single
      # `bundle-path`), which is why this step runs once over the files
      # determined above rather than per asset. Skipped when there is
      # nothing new to attest (a re-run that added no new asset). GPG
      # signing (scripts/sign-release-assets.sh) proves authenticity of the
      # maintainer's choice to publish; this proves which CI run built the
      # bytes being signed — the two are complementary, not redundant.
      - name: Generate build provenance attestation
        id: attest
        if: steps.assets.outputs.new-files != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.new-files }}

      # Staged into dist/ under a release-asset name so the upload step
      # below picks it up with no special-casing, and so a verifier can grab
      # it next to the assets it covers rather than through the Attestations
      # API. The .intoto.jsonl extension matches what SLSA-provenance
      # consumers (including Scorecard's asset scan) look for — it is JSON
      # Lines, one provenance statement per line, which is what lets this
      # step fold a prior run's bundle in rather than discard it: a re-run
      # on an already-published release only attests the files it adds
      # (see "Determine which release assets are new in this run" above),
      # so a bundle already published under this name covers earlier assets
      # this run's bundle says nothing about. The final upload step below
      # always replaces the published bundle with the one staged here, so
      # it must already contain every line that was ever published for this
      # tag; gh release download fails harmlessly when no such asset exists
      # yet (first publish of this tag).
      - name: Stage the provenance bundle as a release asset
        shell: bash
        if: steps.attest.outputs.bundle-path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dest="dist/QtPass-${version}.intoto.jsonl"
          if gh release download "$GITHUB_REF_NAME" \
              --pattern "$(basename "$dest")" --output "$dest.previous" 2>/dev/null; then
            echo "folding in the previously published provenance bundle"
            cat "$dest.previous" "$BUNDLE_PATH" > "$dest"
            rm -f "$dest.previous"
          else
            cp "$BUNDLE_PATH" "$dest"
          fi

      - name: Create the draft release if needed and upload the assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "QtPass ${version}" \
              --notes "Draft created by the Release installers workflow. Replace this with the CHANGELOG section for ${version}."
          fi
          # A draft can be refreshed freely. Once the release is published its
          # assets carry detached signatures (sign-release-assets.sh), and
          # replacing a file would leave the old .asc next to it; then only
          # assets that do not exist yet are added.
          existing="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == "true" ]]; then
            # A signature made while the release was still a draft would no
            # longer match the replaced file; drop it so the signing script
            # produces a fresh one.
            for file in dist/*; do
              asc="$(basename "$file").asc"
              if grep -qxF "$asc" <<<"$existing"; then
                echo "removing stale signature $asc"
                gh release delete-asset "$GITHUB_REF_NAME" "$asc" --yes
              fi
            done
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            for file in dist/*; do
              name="$(basename "$file")"
              if [[ "$name" == *.intoto.jsonl ]]; then
                # Cumulative, not a fixed asset: the staging step above
                # already folded in whatever was published before, so the
                # file here is always a superset and safe to replace outright.
                echo "updating provenance bundle $name"
                gh release upload "$GITHUB_REF_NAME" "$file" --clobber
              elif grep -qxF "$name" <<<"$existing"; then
                echo "keeping published asset $name"
              else
                gh release upload "$GITHUB_REF_NAME" "$file"
              fi
            done
          fi
