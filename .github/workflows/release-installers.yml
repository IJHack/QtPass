---
name: Release Build

on:
  pull_request:
    branches:
      - main
      - "1.8"
  push:
    tags:
      - "v*"
  merge_group:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      tests: ${{ steps.filter.outputs.tests }}
      qt: ${{ steps.filter.outputs.qt }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          base: main
          filters: |
            src:
              - "src/**"
              - "**.cpp"
              - "**.h"
              - "**.hpp"
              - "**.ui"
              - "**.qrc"
            tests:
              - "tests/**"
            qt:
              - "**.pro"
              - "**.pri"
            # The AppImage bundles these but no compiled source changes with
            # them, so the src/qt filters above would miss an edit to them.
            packaging:
              - "scripts/build-appimage.sh"
              - "qtpass.desktop"
              - "qtpass.appdata.xml"
              - "qtpass.1"
              - "artwork/**"
              - ".github/workflows/release-installers.yml"

  build-windows:
    needs: changes
    runs-on: windows-latest
    steps:
      - name: Check if build needed
        id: need_build
        shell: bash
        run: |
          if [[ "${NEEDS_CHANGES_OUTPUTS_SRC}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_TESTS}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_QT}" == "true" ]] || \
             [[ "${{ github.event_name }}" == "merge_group" ]] || \
             [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NEEDS_CHANGES_OUTPUTS_SRC: ${{ needs.changes.outputs.src }}
          NEEDS_CHANGES_OUTPUTS_TESTS: ${{ needs.changes.outputs.tests }}
          NEEDS_CHANGES_OUTPUTS_QT: ${{ needs.changes.outputs.qt }}

      - name: No changes - skipping
        if: steps.need_build.outputs.run_build != 'true'
        run: echo "No relevant changes - skipping Windows build"

      - uses: actions/checkout@v7.0.1
        if: steps.need_build.outputs.run_build == 'true'
        with:
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: steps.need_build.outputs.run_build == 'true'

      - uses: jurplel/install-qt-action@v4.3.1
        if: steps.need_build.outputs.run_build == 'true'
        with:
          # The Windows installer ships on Qt 6.8 (LTS).
          version: "6.8"
          cache: true

      - name: Install Inno Setup
        if: steps.need_build.outputs.run_build == 'true'
        run: choco install --yes innosetup

      - name: Resolve installer version
        if: steps.need_build.outputs.run_build == 'true'
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $line = Get-Content qtpass.pri | Where-Object { $_ -match '^VERSION\s*=' } | Select-Object -First 1
            if ($line -and ($line -match '=\s*([0-9]+\.[0-9]+\.[0-9]+)')) {
              $version = $matches[1]
            } else {
              throw "No VERSION found in qtpass.pri"
            }
          }

          Write-Output "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        if: steps.need_build.outputs.run_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          qmake qtpass.pro CONFIG+=release
          nmake

          New-Item -ItemType Directory -Force -Path dist\qtpass | Out-Null

          if (Test-Path "main\release\qtpass.exe") {
            Copy-Item "main\release\qtpass.exe" "dist\qtpass\qtpass.exe"
          } elseif (Test-Path "src\release\qtpass.exe") {
            Copy-Item "src\release\qtpass.exe" "dist\qtpass\qtpass.exe"
          } else {
            throw "Could not locate built qtpass.exe"
          }

          Copy-Item "README.md" "dist\qtpass\README.txt"
          Copy-Item "LICENSE" "dist\qtpass\LICENSE.txt"

          windeployqt --release --dir dist\qtpass dist\qtpass\qtpass.exe

          iscc "/DMyAppVersion=$env:STEPS_VERSION_OUTPUTS_VERSION" qtpass.iss
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload installer artifact
        if: steps.need_build.outputs.run_build == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: qtpass-windows-installer-${{ steps.version.outputs.version }}
          path: Output/qtpass-*.exe

  build-macos:
    needs: changes
    runs-on: macos-latest
    steps:
      - name: Check if build needed
        id: need_build
        shell: bash
        run: |
          if [[ "${NEEDS_CHANGES_OUTPUTS_SRC}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_TESTS}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_QT}" == "true" ]] || \
             [[ "${{ github.event_name }}" == "merge_group" ]] || \
             [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NEEDS_CHANGES_OUTPUTS_SRC: ${{ needs.changes.outputs.src }}
          NEEDS_CHANGES_OUTPUTS_TESTS: ${{ needs.changes.outputs.tests }}
          NEEDS_CHANGES_OUTPUTS_QT: ${{ needs.changes.outputs.qt }}

      - name: No changes - skipping
        if: steps.need_build.outputs.run_build != 'true'
        run: echo "No relevant changes - skipping macOS build"

      - uses: actions/checkout@v7.0.1
        if: steps.need_build.outputs.run_build == 'true'
        with:
          persist-credentials: false

      - uses: jurplel/install-qt-action@v4.3.1
        if: steps.need_build.outputs.run_build == 'true'
        with:
          # Qt 6.11 (6.11.1+) is required to build on the macos-latest runner:
          # its Xcode 26.x clang rejects the ARM __yield intrinsic used by
          # Qt 6.8.x's qyieldcpu.h. 6.11 reordered that header to prefer
          # __builtin_arm_yield, so it compiles cleanly.
          version: "6.11"
          cache: true

      - name: Install dmg helper
        if: steps.need_build.outputs.run_build == 'true'
        run: brew install create-dmg

      - name: Resolve dmg version
        if: steps.need_build.outputs.run_build == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(awk -F '=' '/^VERSION[[:space:]]*=/{ gsub(/[[:space:]]/, "", $2); print $2; exit }' qtpass.pri)"
            if [[ -z "${version}" ]]; then
              echo "No VERSION found in qtpass.pri" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build macOS app and dmg
        if: steps.need_build.outputs.run_build == 'true'
        run: |
          set -euo pipefail

          qmake qtpass.pro CONFIG+=release
          make

          APP_PATH="main/QtPass.app"
          if [ ! -d "$APP_PATH" ]; then
            if [ -d "src/QtPass.app" ]; then
              APP_PATH="src/QtPass.app"
            else
              echo "QtPass.app not found" >&2
              exit 1
            fi
          fi

          macdeployqt "$APP_PATH"

          DMG_NAME="QtPass-${STEPS_VERSION_OUTPUTS_VERSION}.dmg"
          create-dmg "$DMG_NAME" "$APP_PATH"
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload dmg artifact
        if: steps.need_build.outputs.run_build == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: qtpass-macos-dmg-${{ steps.version.outputs.version }}
          path: QtPass-*.dmg

  build-appimage:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Check if build needed
        id: need_build
        shell: bash
        run: |
          if [[ "${NEEDS_CHANGES_OUTPUTS_SRC}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_TESTS}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_QT}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_PACKAGING}" == "true" ]] || \
             [[ "${{ github.event_name }}" == "merge_group" ]] || \
             [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NEEDS_CHANGES_OUTPUTS_SRC: ${{ needs.changes.outputs.src }}
          NEEDS_CHANGES_OUTPUTS_TESTS: ${{ needs.changes.outputs.tests }}
          NEEDS_CHANGES_OUTPUTS_QT: ${{ needs.changes.outputs.qt }}
          NEEDS_CHANGES_OUTPUTS_PACKAGING: ${{ needs.changes.outputs.packaging }}

      - name: No changes - skipping
        if: steps.need_build.outputs.run_build != 'true'
        run: echo "No relevant changes - skipping AppImage build"

      - uses: actions/checkout@v7.0.1
        if: steps.need_build.outputs.run_build == 'true'
        with:
          persist-credentials: false

      - uses: jurplel/install-qt-action@v4.3.1
        if: steps.need_build.outputs.run_build == 'true'
        with:
          # The AppImage ships on Qt 6.8 (LTS), like the Windows installer.
          # Qt SVG is part of the base install; it is not an add-on module.
          version: "6.8"
          cache: true

      # linuxdeploy and its Qt plugin are AppImages themselves. The build
      # script runs them with APPIMAGE_EXTRACT_AND_RUN=1 so no FUSE is needed
      # here, but the Qt plugin still shells out to patchelf and friends.
      # appstream provides appstreamcli, which the script uses to validate
      # the metainfo file; xvfb and weston are the X11 and Wayland displays
      # for the smoke tests below.
      - name: Install packaging dependencies
        if: steps.need_build.outputs.run_build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2t64 patchelf desktop-file-utils file appstream \
            xvfb weston

      - name: Resolve AppImage version
        if: steps.need_build.outputs.run_build == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(awk -F '=' '/^VERSION[[:space:]]*=/{ gsub(/[[:space:]]/, "", $2); print $2; exit }' qtpass.pri)"
            if [[ -z "${version}" ]]; then
              echo "No VERSION found in qtpass.pri" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        if: steps.need_build.outputs.run_build == 'true'
        run: ./scripts/build-appimage.sh dist
        env:
          VERSION: ${{ steps.version.outputs.version }}

      # A broken bundle still packages cleanly, so prove it actually runs, on
      # X11 (Xvfb) and on Wayland (headless Weston, exercising the bundled
      # libqwayland-generic.so, its shell-integration plugins and their
      # libraries). QtPass builds its QApplication before looking at argv and
      # has no --version short-circuit, so each run has to be killed:
      # surviving the timeout is the pass condition, and any earlier exit
      # means Qt, a plugin or a bundled library failed to load.
      - name: Smoke-test the AppImage
        if: steps.need_build.outputs.run_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          appimage="dist/QtPass-${STEPS_VERSION_OUTPUTS_VERSION}-x86_64.AppImage"
          test -f "$appimage"
          chmod +x "$appimage"
          # Qt's own packages ship the Wayland client plugins, so the build
          # script must have bundled them.
          test -f build-appimage/AppDir/usr/plugins/platforms/libqwayland-generic.so
          test -d build-appimage/AppDir/usr/plugins/wayland-shell-integration

          # No FUSE on the runner, so run the extracted payload.
          export APPIMAGE_EXTRACT_AND_RUN=1

          # stayed_up LOG: 124 means the timeout fired, 143 killed by SIGTERM;
          # anything else is an exit of its own.
          stayed_up() {
            local rc=$1 log=$2
            if [ "$rc" -ne 124 ] && [ "$rc" -ne 143 ]; then
              echo "AppImage exited on its own (rc=$rc); output follows:" >&2
              cat "$log" >&2
              return 1
            fi
          }

          rc=0
          timeout --signal=TERM 30 xvfb-run -a "$appimage" > smoke-x11.log 2>&1 || rc=$?
          stayed_up "$rc" smoke-x11.log
          echo "AppImage started on X11 and stayed running."

          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wl-qtpass --idle-time=0 \
            > weston.log 2>&1 &
          for _ in $(seq 1 50); do
            [ -S "$XDG_RUNTIME_DIR/wl-qtpass" ] && break
            sleep 0.2
          done
          test -S "$XDG_RUNTIME_DIR/wl-qtpass" || { cat weston.log >&2; exit 1; }

          rc=0
          QT_QPA_PLATFORM=wayland WAYLAND_DISPLAY=wl-qtpass \
            timeout --signal=TERM 30 "$appimage" > smoke-wayland.log 2>&1 || rc=$?
          stayed_up "$rc" smoke-wayland.log
          # QT_QPA_PLATFORM names wayland alone, no fallback: had the plugin
          # failed to load, Qt would have aborted, so surviving means it ran
          # on Wayland.
          echo "AppImage started on Wayland and stayed running."
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload AppImage artifact
        if: steps.need_build.outputs.run_build == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: qtpass-appimage-${{ steps.version.outputs.version }}
          path: dist/QtPass-*.AppImage

  # Tag pushes only: attach what the three build jobs produced, plus the source
  # archives, to the GitHub release for that tag. The release is created as a
  # draft when it does not exist yet, so the maintainer only writes the notes,
  # signs the assets (scripts/sign-release-assets.sh) and publishes. Nothing
  # here is downloaded and re-uploaded by hand any more.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
      - build-appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job holds a write token, so its actions are pinned to commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Source archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Same names GitHub gives its automatic archives, so debian/watch
          # and sign-release-assets.sh keep working; unlike the automatic
          # ones these are release assets and never regenerate.
          git archive --prefix="qtpass-${version}/" \
            -o "dist/QtPass-${version}.tar.gz" HEAD
          git archive --prefix="qtpass-${version}/" \
            -o "dist/QtPass-${version}.zip" HEAD
          ls -l dist

      - name: Create the draft release if needed and upload the assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "QtPass ${version}" \
              --notes "Draft created by the Release Build workflow. Replace this with the CHANGELOG section for ${version}."
          fi
          # A draft can be refreshed freely. Once the release is published its
          # assets carry detached signatures (sign-release-assets.sh), and
          # replacing a file would leave the old .asc next to it; then only
          # assets that do not exist yet are added.
          existing="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == "true" ]]; then
            # A signature made while the release was still a draft would no
            # longer match the replaced file; drop it so the signing script
            # produces a fresh one.
            for file in dist/*; do
              asc="$(basename "$file").asc"
              if grep -qxF "$asc" <<<"$existing"; then
                echo "removing stale signature $asc"
                gh release delete-asset "$GITHUB_REF_NAME" "$asc" --yes
              fi
            done
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            for file in dist/*; do
              if grep -qxF "$(basename "$file")" <<<"$existing"; then
                echo "keeping published asset $(basename "$file")"
              else
                gh release upload "$GITHUB_REF_NAME" "$file"
              fi
            done
          fi
