name: REUSE compliance check

# Note: REUSE is a repository-wide compliance check - no path filtering
# to catch licensing issues in any newly added files (scripts, docs, etc.)

on:
  push:
    branches: ["main", "1.8"]
  pull_request:
    branches: ["main", "1.8"]
  merge_group:

permissions: {}

jobs:
  reuse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
