name: REUSE compliance check

on:
  push:
    branches: ["gh-pages"]
  pull_request:
    branches: ["gh-pages"]

permissions: {}

jobs:
  reuse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Prune generated doxygen output before the check
        run: rm -rf docs xml

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v6