---
name: "CodeQL"

on:
  push:
    branches: ["main", "1.8"]
  pull_request:
    branches: ["main", "1.8"]
  schedule:
    - cron: "24 8 * * 2"
  merge_group:

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      tests: ${{ steps.filter.outputs.tests }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          base: main
          filters: |
            src:
              - "src/**"
              - "**.cpp"
              - "**.h"
              - "**.hpp"
              - "**.c"
            tests:
              - "tests/**"
            workflow:
              - ".github/workflows/codeql.yml"

  analyze:
    needs: changes
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["cpp"]

    steps:
      - name: Check if analysis needed
        id: need_analysis
        shell: bash
        run: |
          if [[ "${NEEDS_CHANGES_OUTPUTS_SRC}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_TESTS}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_WORKFLOW}" == "true" ]] || \
             [[ "${{ github.event_name }}" == "merge_group" ]] || \
             [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "run_analysis=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_analysis=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NEEDS_CHANGES_OUTPUTS_SRC: ${{ needs.changes.outputs.src }}
          NEEDS_CHANGES_OUTPUTS_TESTS: ${{ needs.changes.outputs.tests }}
          NEEDS_CHANGES_OUTPUTS_WORKFLOW: ${{ needs.changes.outputs.workflow }}

      - name: No changes - skipping
        if: steps.need_analysis.outputs.run_analysis != 'true'
        run: echo "No relevant changes - skipping CodeQL analysis"

      - name: Checkout repository
        if: steps.need_analysis.outputs.run_analysis == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        if: steps.need_analysis.outputs.run_analysis == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          # CodeQL 2.27.2's C++ finalize aborts when the TRAP cache has no
          # tarballs/ directory (filesystem_error, exit 134); the cache
          # saves this project little time anyway.
          trap-caching: false
          languages: ${{ matrix.language }}

      - name: Install Qt
        if: steps.need_analysis.outputs.run_analysis == 'true'
        uses: jurplel/install-qt-action@v4.3.1

      - name: Autobuild
        if: steps.need_analysis.outputs.run_analysis == 'true'
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Perform CodeQL Analysis
        if: steps.need_analysis.outputs.run_analysis == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{matrix.language}}"
