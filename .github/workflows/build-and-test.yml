---
name: Build and test

on:
  push:
    branches: ["main", "1.8"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "1.8"]
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      tests: ${{ steps.filter.outputs.tests }}
      qt: ${{ steps.filter.outputs.qt }}
      localization: ${{ steps.filter.outputs.localization }}
      icons: ${{ steps.filter.outputs.icons }}
      docs: ${{ steps.filter.outputs.docs }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: main
          filters: |
            src:
              - "src/**"
              - "**.cpp"
              - "**.h"
              - "**.hpp"
              - "**.ui"
              - "**.qrc"
            tests:
              - "tests/**"
            qt:
              - "**.pro"
              - "**.pri"
            localization:
              - "localization/**"
            icons:
              - "icons/**"
            docs:
              - "docs/**"
            # A change to this workflow must run it: #1867 went two rounds
            # with every build job skipped.
            workflow:
              - ".github/workflows/build-and-test.yml"

  build:
    name: ${{ matrix.name }} (Qt ${{ matrix.qt }})
    needs: changes
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Qt 6.8 (LTS) is verified on Linux and Windows. macOS is not tested on
        # 6.8: the macos-latest runner's Xcode 26.x cannot compile Qt 6.8.x
        # (qyieldcpu.h uses the ARM __yield intrinsic, unfixed until 6.11.1).
        # macOS is covered by the 6.11 entry, matching what the dmg ships.
        # `name` is what the job is called (and what branch protection
        # requires): the platform, not the runner image.
        include:
          - name: Ubuntu
            os: ubuntu-latest
            qt: "6.8"
          - name: Ubuntu
            os: ubuntu-latest
            qt: "6.11"
          - name: Windows
            os: windows-latest
            qt: "6.8"
          - name: macOS
            os: macos-latest
            qt: "6.11"

    steps:
      - name: Check if build needed
        id: need_build
        shell: bash
        run: |
          if [[ "${NEEDS_CHANGES_OUTPUTS_SRC}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_TESTS}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_QT}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_LOCALIZATION}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_ICONS}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_DOCS}" == "true" ]] || \
             [[ "${NEEDS_CHANGES_OUTPUTS_WORKFLOW}" == "true" ]] || \
             [[ "${{ github.event_name }}" == "merge_group" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NEEDS_CHANGES_OUTPUTS_SRC: ${{ needs.changes.outputs.src }}
          NEEDS_CHANGES_OUTPUTS_TESTS: ${{ needs.changes.outputs.tests }}
          NEEDS_CHANGES_OUTPUTS_QT: ${{ needs.changes.outputs.qt }}
          NEEDS_CHANGES_OUTPUTS_LOCALIZATION: ${{ needs.changes.outputs.localization }}
          NEEDS_CHANGES_OUTPUTS_ICONS: ${{ needs.changes.outputs.icons }}
          NEEDS_CHANGES_OUTPUTS_DOCS: ${{ needs.changes.outputs.docs }}
          NEEDS_CHANGES_OUTPUTS_WORKFLOW: ${{ needs.changes.outputs.workflow }}

      - name: No changes - skipping
        if: steps.need_build.outputs.run_build != 'true'
        run: echo "No relevant changes - skipping build"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.need_build.outputs.run_build == 'true'
        with:
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: steps.need_build.outputs.run_build == 'true'

      - name: Install Qt
        if: steps.need_build.outputs.run_build == 'true'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ matrix.qt }}
          # Restore the unpacked Qt from the Actions cache instead of pulling
          # ~600 MB from the Qt mirrors on every run. aqtinstall fetches the
          # .sha256 files from download.qt.io only (no mirror carries them, for
          # any 6.11.x), so a download.qt.io hiccup fails every uncached run
          # ("Failed to download checksum ... from mirrors"); with the cache
          # warm that can only hit the first run after a Qt patch release.
          cache: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux' && steps.need_build.outputs.run_build == 'true'
        # pass-extension-otp is only needed by tst_integration's coverage of the
        # legacy Pass::OtpGenerate passthrough. QtPass itself generates TOTP
        # in-process, so this can go whenever that test does.
        run: |
          sudo apt-get update
          sudo apt-get install -y pinentry-tty pass pass-extension-otp

      - name: Configure Git for tests
        if: steps.need_build.outputs.run_build == 'true'
        run: |
          git config --global commit.gpgsign false
          git config --global tag.gpgsign false
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Runner"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS' && steps.need_build.outputs.run_build == 'true'
        # pass-otp only serves the legacy passthrough test; see the Linux step.
        run: |
          brew install pass pass-otp

      - name: qmake
        if: steps.need_build.outputs.run_build == 'true'
        run: qmake

      - name: make
        if: steps.need_build.outputs.run_build == 'true'
        run: ${{ runner.os == 'Windows' && 'nmake' || 'make' }}

      - name: make check
        if: steps.need_build.outputs.run_build == 'true'
        # Without a console, Qt on Windows sends QtTest's report to the
        # debugger (OutputDebugString) and the job log shows nmake's exit code
        # alone (QPlainTestLogger::outputMessage checks shouldLogToStderr());
        # this makes it write to the standard streams, where the log can see it.
        env:
          QT_FORCE_STDERR_LOGGING: ${{ runner.os == 'Windows' && '1' || '' }}
        run: ${{ runner.os == 'Windows' && 'nmake' || 'make' }} check TESTARGS="--platform offscreen"

  # The BSDs build in a VM (vmactions), from the system's Qt 6 packages
  # rather than a pinned Qt, so their jobs say "(Qt 6)". Same gate as the
  # matrix: a change that does not touch the build skips them (the jobs then
  # show as skipped; they are not required checks). Tags get a run too, so a
  # release has the BSD result to point at.
  freebsd:
    name: FreeBSD 14 (Qt 6)
    needs: changes
    if: >-
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.qt == 'true' ||
      needs.changes.outputs.localization == 'true' ||
      needs.changes.outputs.icons == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and run the test suites in a FreeBSD VM
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: "14"
          usesh: true
          mem: 6144
          cpu: 3
          sync: rsync
          copyback: false
          prepare: |
            pkg install -y qt6-base qt6-tools qt6-svg gnupg git
          run: |
            set -e
            freebsd-version
            qmake6 -v
            # the rsynced tree is owned by another uid inside the VM
            git config --global --add safe.directory "$(pwd)"
            qmake6 qtpass.pro
            make -j3
            # The suites need a display; the offscreen QPA is enough.
            export QT_QPA_PLATFORM=offscreen
            make check

  openbsd:
    name: OpenBSD 7.9 (Qt 6)
    needs: changes
    if: >-
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.qt == 'true' ||
      needs.changes.outputs.localization == 'true' ||
      needs.changes.outputs.icons == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and run the test suites in an OpenBSD VM
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1.4.7
        with:
          release: "7.9"
          usesh: true
          mem: 6144
          cpu: 3
          sync: rsync
          copyback: false
          prepare: |
            pkg_add -I qt6-qtbase qt6-qttools qt6-qtsvg gnupg git gmake
          run: |
            set -e
            sysctl -n kern.version | head -1
            qmake-qt6 -v
            # the rsynced tree is owned by another uid inside the VM
            git config --global --add safe.directory "$(pwd)"
            qmake-qt6 qtpass.pro
            gmake -j3
            # The suites need a display; the offscreen QPA is enough.
            export QT_QPA_PLATFORM=offscreen
            gmake check
