---
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    # Wait 7 days after a new action release before opening an update PR.
    # Mitigates malicious-release attacks (e.g. tj-actions/changed-files
    # incident) by giving time for compromise reports to surface.
    cooldown:
      default-days: 7

    commit-message:
      prefix: "ci"

    open-pull-requests-limit: 5

    # Every github/codeql-action step in a workflow must run the same
    # version: analyze refuses a configuration file written by a different
    # init. Group them so one PR bumps init, autobuild, analyze and
    # upload-sarif together. Dependabot names each step by its path
    # (github/codeql-action/init and so on), so the pattern needs the
    # wildcard.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # The OSS Scanner build image (.oss-scanner/Dockerfile) is pinned by
  # digest; this keeps the digest current.
  - package-ecosystem: "docker"
    directory: "/.oss-scanner"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 2
