---
# zizmor configuration, see https://docs.zizmor.sh/configuration/
#
# Every `uses:` is pinned to a commit SHA with its version tag as a comment,
# and dependabot upgrades them. The policy below only sets the floor: a
# version-tag pin (ref-pin) would still pass, so a workflow that has not been
# converted yet does not fail the lint.
rules:
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
  # secrets-outside-env wants every `${{ secrets.X }}` use to live inside a
  # job with `environment: <name>` declared, so that environment-level
  # approval gates and per-environment secret scoping can apply. Useful for
  # large projects with deploy gates; overkill for a single-repo OSS app.
  # The docs/linter workflows reference CODECOV_TOKEN / GITHUB_TOKEN directly.
  # Disable the audit rather than carry an empty environment for every
  # secret-using job.
  secrets-outside-env:
    disable: true
